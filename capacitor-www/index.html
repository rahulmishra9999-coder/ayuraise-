<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AyuRaise</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f1419; color: #e5e7eb;
        font-family: system-ui, -apple-system, sans-serif; }
      .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100%; gap: 14px; text-align: center; padding: 24px; }
      .dot { width: 44px; height: 44px; border-radius: 14px;
        background: linear-gradient(160deg,#fda4af,#f43f5e 55%,#9f1239); }
      .msg { font-size: 13px; opacity: .7; max-width: 260px; line-height: 1.5; }
      h1 { font-size: 20px; font-weight: 800; margin: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot"></div>
      <h1>AyuRaise</h1>
      <p class="msg">Connecting to the app… make sure the dev server is running and your phone is on the same Wi-Fi.</p>
    </div>
  </body>
</html>
